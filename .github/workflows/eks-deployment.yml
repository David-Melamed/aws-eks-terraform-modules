  name: "ProvisionEKSCluster"

  on:
    workflow_dispatch:
      inputs:
        cluster_exists:
          description: "Does the cluster already exist?"
          required: true
          default: "yes"
          type: choice
          options:
            - yes
            - no
        apply_flag:
          description: 'Set to "true" to apply changes after plan'
          required: false
          default: 'false'
        tf_version:
          description: 'Specifies version of Terraform to use. e.g: 1.1.0 Default=latest.'
          required: false
          default: 'latest'
        gh_environment:
          description: 'Specifies the GitHub deployment environment.'
          required: false
          default: 'development'
        region:
          description: 'Choose the AWS region to deploy to.'
          required: false
          default: 'eu-west-1'
    pull_request:
      types: [opened, reopened]

  jobs:
    Plan:
      uses: David-Melamed/aws-eks-terraform-modules/.github/workflows/aws_tf_plan.yml@feature/eks-deployment-cicd
      with: 
        tf_version: ${{ inputs.tf_version }}
        gh_environment: ${{ inputs.gh_environment }}
        region: ${{ inputs.region }}
        cluster_exists: ${{ inputs.cluster_exists }}
      secrets:
        cli_config_credentials_token: ${{ secrets.EKS_TFC_API_TOKEN }}
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      permissions:
        pull-requests: write
        contents: read

    Apply:
      needs: Plan
      if: ${{ inputs.apply_flag == 'true' }}
      uses: David-Melamed/aws-eks-terraform-modules/.github/workflows/aws_tf_apply.yml@feature/eks-deployment-cicd
      with:
        tf_version: ${{ inputs.tf_version }}
        gh_environment: ${{ inputs.gh_environment }}
        region: ${{ inputs.region }}
        cluster_exists: ${{ inputs.cluster_exists }}
      secrets:
        cli_config_credentials_token: ${{ secrets.EKS_TFC_API_TOKEN }}
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      permissions:
        pull-requests: write
        contents: read